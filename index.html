<!doctype html>
<html lang="en">
  <head>
    <!-- START: Page metadata and stylesheets -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>My LinkedIn Journey — Content Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!-- END: Page metadata and stylesheets -->
  </head>
  <body>
    <!-- START: Header and primary navigation -->
    <header class="topbar">
      <button class="menu" aria-label="Open navigation" aria-expanded="false" id="menuBtn">☰</button>
      <nav class="nav left">
        <button data-view="overview" class="active">Overview</button
        ><button data-view="schedule">My Schedule</button
        ><button data-view="planner">Content Planner</button>
      </nav>
      <a class="brand" href="#overview" aria-label="My LinkedIn Journey home"
        ><span class="brand-mark">MJ</span><span>My LinkedIn Journey</span></a
      >
      <nav class="nav right">
        <button data-view="ideas">Ideas Bank</button
        ><button data-view="history">Post History</button
        ><button data-view="insights">Insights</button
        ><button data-view="settings">Settings</button>
      </nav>
    </header>
    <!-- END: Header and primary navigation -->

    <!-- START: Application views -->
    <!-- The seven views are rendered here by app.js: Overview, Schedule, Planner,
         Ideas Bank, Post History, Insights, and Settings. -->
    <main id="app"></main>
    <!-- END: Application views -->

    <!-- START: Footer and social links -->
    <footer class="site-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-main">
          <div class="footer-brand">
            <span class="brand-mark" aria-hidden="true">MJ</span
            ><span>My LinkedIn Journey</span>
          </div>
          <p class="footer-description">
            A personal space to plan, create, publish and track my LinkedIn
            journey.
          </p>
        </div>
        <div class="footer-connect">
          <p class="footer-caption">Created by <strong>Dhozie</strong></p>
          <nav class="footer-links" aria-label="Professional profiles">
            <a
              href="https://www.linkedin.com/in/okoli-chidozie-891074384/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dhozie on LinkedIn"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.35V9h3.414v1.561h.049c.476-.9 1.637-1.85 3.37-1.85 3.602 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 110-4.124 2.062 2.062 0 010 4.124zM7.119 20.452H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
                /></svg
              ><span>LinkedIn</span></a
            ><a
              href="https://github.com/Dhozie"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Dhozie on GitHub"
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 .7a11.3 11.3 0 00-3.57 22.02c.57.1.77-.25.77-.55v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.52-1.3-1.26-1.65-1.26-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.52-2.5-.28-5.13-1.25-5.13-5.57 0-1.23.44-2.24 1.17-3.03-.12-.29-.51-1.44.11-3 0 0 .95-.3 3.11 1.16a10.8 10.8 0 015.66 0c2.16-1.46 3.1-1.16 3.1-1.16.63 1.56.24 2.71.12 3 .73.79 1.16 1.8 1.16 3.03 0 4.33-2.63 5.28-5.14 5.56.4.35.76 1.04.76 2.1v3.1c0 .3.2.66.77.55A11.3 11.3 0 0012 .7z"
                /></svg
              ><span>GitHub</span></a
            >
          </nav>
        </div>
        <div class="footer-bottom">
          <span
            >© <span id="copyrightYear"></span> My LinkedIn Journey. All rights
            reserved.</span
          >
        </div>
      </div>
    </footer>
    <!-- END: Footer and social links -->

    <!-- START: Post editor dialog -->
    <dialog id="postDialog">
      <form id="postForm" method="dialog">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">CONTENT PLANNER</p>
            <h2 id="postDialogTitle">New post</h2>
          </div>
          <button type="button" class="icon-btn" data-close aria-label="Close">
            ×
          </button>
        </div>
        <input type="hidden" name="id" /><label
          >Post title<input
            name="title"
            required
            maxlength="120"
            placeholder="Give your post a clear title"
        /></label>
        <div class="form-row">
          <label>Category<select name="category" required></select></label
          ><label
            >Status<select name="status">
              <option>Planned</option>
              <option>Ready</option>
              <option>Published</option>
            </select></label
          >
        </div>
        <label
          >Content or draft<textarea
            name="content"
            rows="7"
            placeholder="Start shaping your thoughts…"
          ></textarea>
        </label>
        <div class="form-row">
          <label>Scheduled date<input type="date" name="date" required /></label
          ><label
            >LinkedIn URL <span class="muted">(optional)</span
            ><input
              type="url"
              name="url"
              placeholder="https://www.linkedin.com/posts/…"
          /></label>
        </div>
        <p class="form-error" id="formError" aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="button" class="button quiet" data-close>Cancel</button
          ><button class="button dark">Save post</button>
        </div>
      </form>
    </dialog>
    <!-- END: Post editor dialog -->

    <!-- START: Idea editor dialog -->
    <dialog id="ideaDialog">
      <form id="ideaForm" method="dialog">
        <div class="dialog-head">
          <div>
            <p class="eyebrow">IDEAS BANK</p>
            <h2 id="ideaDialogTitle">New idea</h2>
          </div>
          <button type="button" class="icon-btn" data-close aria-label="Close">
            ×
          </button>
        </div>
        <input type="hidden" name="id" /><label
          >Idea title<input name="title" required maxlength="120" /></label
        ><label
          >Rough notes<textarea name="description" rows="5"></textarea></label
        ><label>Category<select name="category"></select></label>
        <div class="dialog-actions">
          <button type="button" class="button quiet" data-close>Cancel</button
          ><button class="button dark">Save idea</button>
        </div>
      </form>
    </dialog>
    <!-- END: Idea editor dialog -->

    <!-- START: Notifications, import input, and application script -->
    <div id="toast" role="status" aria-live="polite"></div>
    <input id="importFile" type="file" accept="application/json,.json" hidden />
    <script src="assets/js/app.js" defer></script>
    <!-- END: Notifications, import input, and application script -->
  </body>
</html>
